spring.application.name=bpms-simple

server.port=${SERVER_PORT:8080}
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# form submissions contain Chinese text; force UTF-8 decoding (Tomcat/Servlet defaults to ISO-8859-1)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bpms}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Taipei
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# data.sql seed runs after Hibernate creates/updates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Mail (Gmail SMTP) ---
# Set MAIL_USERNAME / MAIL_APP_PASSWORD as environment variables.
# MAIL_APP_PASSWORD must be a Gmail "App Password", not your normal login password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# base URL used to build the "他人代領" link inside notification emails
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Thymeleaf: disable caching while developing
spring.thymeleaf.cache=false
