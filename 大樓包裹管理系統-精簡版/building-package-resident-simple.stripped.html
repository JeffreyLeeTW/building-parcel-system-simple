<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大樓包裹管理平台｜住戶精簡版</title>
  <style>
    :root{--navy:#29384b;--green:#34786c;--green-bg:#edf5f3;--red:#b4424d;--red-bg:#fff3f4;--amber:#8a641d;--amber-bg:#fff8e8;--ink:#273142;--muted:#6b7280;--line:#d8dde3;--bg:#f3f4f6;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei",Arial,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .access{min-height:100vh;display:grid;place-items:center;padding:30px}.access-box{width:700px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--navy);padding:36px}.access-title{font-size:23px;font-weight:700}.access-sub{color:var(--muted);margin-top:7px}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.role-card{border:1px solid var(--line);background:#fff;border-radius:5px;padding:24px;text-align:left}.role-card:hover{border-color:#8793a2}.role-icon{width:40px;height:40px;background:#eef1f4;border-radius:4px;display:grid;place-items:center;font-size:20px;margin-bottom:18px}.role-card b{font-size:17px;display:block}.role-card p{color:var(--muted);line-height:1.6;margin:8px 0 18px}.role-card span{color:var(--green);font-weight:700}
    .shell{min-width:1050px;min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}.brand{font-weight:700;font-size:16px}.top-right{display:flex;align-items:center;gap:14px}.user{text-align:right}.user small{display:block;color:var(--muted)}.outline{height:34px;border:1px solid #cbd2da;background:#fff;border-radius:4px;padding:0 12px;color:#4b5563}.layout{display:grid;grid-template-columns:200px 1fr}.side{min-height:calc(100vh - 64px);background:var(--navy);padding:22px 14px}.side-label{color:#97a4b5;font-size:11px;padding:0 10px 10px}.side button{width:100%;border:0;background:transparent;color:#c8d0dc;text-align:left;padding:12px;border-radius:4px;margin-bottom:4px}.side button.active,.side button:hover{background:rgba(255,255,255,.1);color:#fff}.content{padding:28px 32px 50px;max-width:1300px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.head h1{font-size:23px;margin:0}.head p{color:var(--muted);margin:6px 0 0}.button{height:40px;border:0;border-radius:4px;padding:0 17px;background:var(--green);color:#fff;font-weight:700}.button:disabled{background:#aeb8b5}.button.secondary{background:#fff;color:#374151;border:1px solid #cfd5dc}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:5px}.card-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h2{font-size:16px;margin:0}.card-body{padding:20px}.badge{display:inline-block;padding:5px 8px;border-radius:3px;font-size:12px;font-weight:700}.available{color:#27675d;background:var(--green-bg)}.proxy{color:#6f541d;background:var(--amber-bg)}.picked{color:#5b6470;background:#eef0f2}.notice{color:#27675d;background:var(--green-bg);border:1px solid #d2e4df;padding:13px 15px;border-radius:4px;margin-bottom:18px}.package-list{display:grid;gap:12px}.package{border:1px solid var(--line);border-radius:4px;padding:17px;display:grid;grid-template-columns:1fr auto;gap:12px}.package h3{font-size:15px;margin:0 0 10px}.package-data{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.datum small{display:block;color:var(--muted);margin-bottom:5px}.code{font-size:20px;letter-spacing:.16em}.actions{display:flex;gap:8px;align-items:flex-end}.mini{height:34px;border:1px solid #cbd2da;background:#fff;border-radius:4px;padding:0 11px}.field{margin-bottom:15px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;height:42px;border:1px solid #cbd2da;border-radius:4px;padding:0 11px;background:#fff}.check{display:flex;gap:9px;align-items:flex-start;color:#4b5563;line-height:1.5;margin:12px 0 18px}.check input{margin-top:3px}.history{width:100%;border-collapse:collapse}.history th,.history td{text-align:left;padding:13px 15px;border-bottom:1px solid #e6e9ed;font-size:13px}.history th{background:#f7f8fa;color:#626c79}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input,.toolbar select{height:40px;border:1px solid #cbd2da;border-radius:4px;background:#fff;padding:0 11px}.toolbar input{min-width:270px}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:4px;padding:17px}.stat small{color:var(--muted)}.stat strong{font-size:24px;display:block;margin-top:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.form-actions{text-align:right;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:25px;top:80px;background:#fff;border:1px solid #cfd8d4;border-left:4px solid var(--green);padding:13px 17px;box-shadow:0 7px 20px rgba(20,30,45,.13);opacity:0;transform:translateY(-7px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.42);display:grid;place-items:center;z-index:40}.modal{width:470px;background:#fff;border-radius:5px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.modal h2{margin:0 0 7px}.modal p{color:var(--muted)}.modal-data{background:#f6f7f9;padding:12px 15px;margin:17px 0}.modal-data div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e0e4e8}.modal-data div:last-child{border:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.resident-shell .layout{grid-template-columns:1fr}.resident-shell .content{max-width:1060px}.resident-shell .topbar{border-top:4px solid var(--green);height:68px}@media(max-width:1100px){.content{padding:24px}.grid{grid-template-columns:1fr}.access-box{width:650px}}
    .steps{display:flex;background:#fff;border:1px solid var(--line);padding:13px 16px;margin-bottom:17px}.step{display:flex;align-items:center;gap:7px;color:#8b94a0;flex:1}.step:after{content:"";height:1px;background:#d8dde3;flex:1;margin:0 10px}.step:last-child:after{display:none}.step i{width:25px;height:25px;border:1px solid #cbd2da;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}.step.active{color:var(--ink);font-weight:700}.step.active i,.step.done i{background:var(--green);border-color:var(--green);color:#fff}.type-banner{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #cfd7d4;border-left:4px solid var(--green);padding:13px 15px;margin-bottom:13px}.pickup-search{max-width:720px;margin:auto}.pickup-search .code-input{font-size:22px;letter-spacing:.18em}.search-row{display:grid;grid-template-columns:1fr auto;gap:9px}.test-hint{color:var(--muted);font-size:12px;margin-top:12px}.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.verify-box{border:1px solid var(--line);padding:13px}.verify-box small{display:block;color:var(--muted);margin-bottom:5px}.camera-box{height:330px;background:#263241;display:grid;place-items:center;color:#d7dde5;position:relative;overflow:hidden}.camera-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.camera-status{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:14px;margin-top:12px}.success{text-align:center;padding:42px}.success-mark{width:60px;height:60px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:28px;margin:0 auto 15px}
  </style>
</head>
<body>
  <section class="access hidden" id="accessPage">
    <div class="access-box">
      <div class="access-title">大樓包裹管理平台</div>
      <div class="access-sub">請選擇使用身分</div>
      <div class="role-grid">
        <button class="role-card" id="residentEntry"><div class="role-icon">住</div><b>住戶入口</b><p>查看待領包裹、設定代領人及確認通知。</p><span>進入住戶頁面 →</span></button>
        <button class="role-card" id="adminEntry"><div class="role-icon">管</div><b>管理員入口</b><p>登記包裹、管理待領清單及處理領取。</p><span>進入管理頁面 →</span></button>
      </div>
    </div>
  </section>

  <section class="shell resident-shell" id="residentApp">
    <header class="topbar"><div class="brand">大樓包裹管理平台｜住戶</div><div class="top-right"><div class="user"><b>張雅婷</b><small>B棟 8F-2</small></div><button class="outline" onclick="goToPage('building-package-admin-simple.html')">管理員頁面</button></div></header>
    <div class="layout"><main class="content" id="residentContent"></main></div>
  </section>

  <section class="shell hidden" id="adminApp">
    <header class="topbar"><div class="brand">大樓包裹管理平台｜管理員</div><div class="top-right"><div class="user"><b>林怡君</b><small>管理員</small></div><button class="outline switchRole">切換身分</button></div></header>
    <div class="layout"><aside class="side"><div class="side-label">管理功能</div><button class="active" data-admin="pickup">包裹領取</button><button data-admin="packages">包裹管理</button><button data-admin="add">登記到貨</button><button data-admin="residents">住戶與代領</button><button data-admin="records">領取紀錄</button></aside><main class="content" id="adminContent"></main></div>
  </section>
  <div id="modalRoot"></div><div class="toast" id="toast">資料已更新</div>

  <script>
    let adminTab='pickup',pickupStep=1,pickupItem=null,pickupVerified=false,pickupPhoto=false;
    let packages=[
      {id:'PKG-20260818-0821',code:'4826',resident:'陳怡安',room:'A棟 12F-3',cabinet:'C-18',date:'2026/08/18 10:22',status:'available',proxy:''},
      {id:'PKG-20260818-0814',code:'7319',resident:'陳怡安',room:'A棟 12F-3',cabinet:'A-07',date:'2026/08/18 09:35',status:'available',proxy:'黃雅雯'},
      {id:'PKG-20260817-0792',code:'3504',resident:'張雅婷',room:'B棟 8F-2',cabinet:'B-11',date:'2026/08/17 16:48',status:'available',proxy:''},
      {id:'PKG-20260817-0768',code:'2291',resident:'李冠廷',room:'C棟 5F-1',cabinet:'D-03',date:'2026/08/17 14:10',status:'picked',proxy:''}
    ];
    let records=[{id:'REC-0817-041',parcel:'PKG-20260817-0768',resident:'李冠廷',recipient:'李冠廷',type:'本人領取',time:'2026/08/17 18:32',admin:'吳志豪'}];
    const RESIDENT_PHOTO='DATA_URI_PLACEHOLDER';
    const PROXY_PHOTO='DATA_URI_PLACEHOLDER';
    const access=document.getElementById('accessPage'),residentApp=document.getElementById('residentApp'),adminApp=document.getElementById('adminApp'),residentContent=document.getElementById('residentContent'),adminContent=document.getElementById('adminContent'),modalRoot=document.getElementById('modalRoot');
    function loadTransferredState(){if(!location.hash.startsWith('#state='))return;try{const state=JSON.parse(decodeURIComponent(location.hash.slice(7)));if(Array.isArray(state.packages))packages=state.packages;if(Array.isArray(state.records))records=state.records}catch(error){console.warn('無法讀取同步資料')}}
    function saveState(){const state=encodeURIComponent(JSON.stringify({packages,records}));history.replaceState(null,'','#state='+state)}
    function goToPage(file){saveState();location.href=file+location.hash}
    function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
    function openRole(role){access.classList.add('hidden');residentApp.classList.toggle('hidden',role!=='resident');adminApp.classList.toggle('hidden',role!=='admin');role==='resident'?renderResident():renderAdmin()}
    function backToRoles(){residentApp.classList.add('hidden');adminApp.classList.add('hidden');access.classList.remove('hidden')}
    document.getElementById('residentEntry').onclick=()=>openRole('resident');document.getElementById('adminEntry').onclick=()=>openRole('admin');document.querySelectorAll('.switchRole').forEach(b=>b.onclick=backToRoles);
    function badge(p){if(p.status==='picked')return '<span class="badge picked">已領取</span>';if(p.proxy)return '<span class="badge proxy">已授權代領</span>';return '<span class="badge available">待領取</span>'}
    function renderResident(){const mine=packages.filter(p=>p.resident==='張雅婷'&&p.status==='available');residentContent.innerHTML=`<div class="head"><div><h1>我的包裹</h1><p>查看待領包裹與代領設定</p></div></div><div class="notice">您目前有 ${mine.length} 件包裹等待領取。</div><section class="card"><div class="card-head"><h2>待領包裹</h2></div><div class="card-body"><div class="package-list">${mine.map(p=>`<article class="package"><div><h3>${p.id}　${badge(p)}</h3><div class="package-data"><div class="datum"><small>包裹碼</small><b class="code">${p.code}</b></div><div class="datum"><small>櫃位</small><b>${p.cabinet}</b></div><div class="datum"><small>到貨時間</small><b>${p.date}</b></div></div>${p.proxy?`<div style="margin-top:12px;color:#6f541d">代領人：${p.proxy}</div>`:''}</div><div class="actions"><button class="mini" onclick="openProxy('${p.id}')">${p.proxy?'修改代領人':'設定代領人'}</button></div></article>`).join('')||'<div class="empty">目前沒有待領包裹</div>'}</div></div></section><section class="card" style="margin-top:18px"><div class="card-head"><h2>近期領取紀錄</h2></div><table class="history"><thead><tr><th>包裹編號</th><th>實際領取人</th><th>領取方式</th><th>領取時間</th></tr></thead><tbody>${records.filter(r=>r.resident==='張雅婷').map(r=>`<tr><td>${r.parcel}</td><td>${r.recipient}</td><td>${r.type}</td><td>${r.time}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">尚無領取紀錄</td></tr>'}</tbody></table></section>`}
    function openProxy(id){const p=packages.find(x=>x.id===id);modalRoot.innerHTML=`<div class="modal-bg"><form class="modal" id="proxyForm"><h2>設定包裹代領人</h2><p>${p.id}｜${p.room}</p><div class="field"><label>代領人姓名</label><input id="proxyName" value="${p.proxy}" required placeholder="請輸入真實姓名"></div><label class="check"><input type="checkbox" required>我授權上述人士代為領取此包裹。</label><div class="modal-actions"><button type="button" class="button secondary" id="closeModal">取消</button><button class="button">確認授權</button></div></form></div>`;document.getElementById('closeModal').onclick=()=>modalRoot.innerHTML='';document.getElementById('proxyForm').onsubmit=e=>{e.preventDefault();p.proxy=document.getElementById('proxyName').value.trim();saveState();modalRoot.innerHTML='';renderResident();showToast('代領授權已完成')}}
    document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.admin;document.querySelectorAll('[data-admin]').forEach(x=>x.classList.toggle('active',x===b));renderAdmin()});
    function renderAdmin(){if(adminTab==='pickup')return renderPickup();if(adminTab==='add')return renderAdd();if(adminTab==='residents')return renderResidents();if(adminTab==='records')return renderRecords();renderPackages()}
    function pickupSteps(){return `<div class="steps"><div class="step ${pickupStep===1?'active':pickupStep>1?'done':''}"><i>${pickupStep>1?'✓':'1'}</i>搜尋包裹</div><div class="step ${pickupStep===2?'active':pickupStep>2?'done':''}"><i>${pickupStep>2?'✓':'2'}</i>身分查驗</div><div class="step ${pickupStep===3?'active':pickupStep>3?'done':''}"><i>${pickupStep>3?'✓':'3'}</i>照片存證</div><div class="step ${pickupStep===4?'active':''}"><i>4</i>完成</div></div>`}
    function renderPickup(){let body='';if(pickupStep===1)body=`<section class="card pickup-search"><div class="card-head"><h2>輸入包裹碼</h2></div><div class="card-body"><div class="search-row"><input class="code-input" id="pickupCode" maxlength="4" inputmode="numeric" placeholder="4 位數包裹碼"><button class="button" id="pickupSearch">搜尋</button></div><div class="test-hint">測試碼：4826 本人領取　／　7319 授權代領</div><div id="pickupError"></div></div></section>`;if(pickupStep===2)body=pickupVerifyView();if(pickupStep===3)body=pickupPhotoView();if(pickupStep===4)body=`<section class="card success"><div class="success-mark">✓</div><h2>包裹領取完成</h2><p>${pickupItem.id} 已更新為已領取，確認信已寄送。</p><button class="button" id="nextPickup">處理下一件包裹</button></section>`;adminContent.innerHTML=`<div class="head"><div><h1>包裹領取</h1><p>搜尋、查驗身分並完成交付</p></div></div>${pickupSteps()}${body}`;bindPickupFlow()}
    function bindPickupFlow(){document.getElementById('pickupSearch')?.addEventListener('click',searchPickup);document.getElementById('pickupCode')?.addEventListener('keydown',e=>{if(e.key==='Enter')searchPickup()});document.getElementById('verifyPickup')?.addEventListener('change',e=>{pickupVerified=e.target.checked;document.getElementById('toPickupPhoto').disabled=!pickupVerified});document.getElementById('toPickupPhoto')?.addEventListener('click',()=>{pickupStep=3;renderPickup()});document.getElementById('backPickupSearch')?.addEventListener('click',()=>{pickupStep=1;renderPickup()});document.getElementById('capturePickup')?.addEventListener('click',()=>{pickupPhoto=true;renderPickup()});document.getElementById('retakePickup')?.addEventListener('click',()=>{pickupPhoto=false;renderPickup()});document.getElementById('confirmPickup')?.addEventListener('click',confirmPickupHandover);document.getElementById('backPickupVerify')?.addEventListener('click',()=>{pickupStep=2;renderPickup()});document.getElementById('nextPickup')?.addEventListener('click',()=>{pickupStep=1;pickupItem=null;pickupVerified=false;pickupPhoto=false;renderPickup()})}
    function searchPickup(){const code=document.getElementById('pickupCode').value.trim(),item=packages.find(p=>p.code===code),error=document.getElementById('pickupError');if(!item){error.innerHTML='<div class="notice" style="margin-top:14px;color:#8b3540;background:#fff3f4;border-color:#f0cbd0">找不到此包裹</div>';return}if(item.status==='picked'){error.innerHTML='<div class="notice" style="margin-top:14px;color:#8b3540;background:#fff3f4;border-color:#f0cbd0">此包裹已領取，不能再次交付</div>';return}pickupItem=item;pickupStep=2;pickupVerified=false;pickupPhoto=false;renderPickup()}
    function pickupVerifyView(){const proxy=!!pickupItem.proxy;return `<div class="type-banner"><span>領取方式</span><b>${proxy?'授權代領':'本人領取'}</b></div><section class="card"><div class="card-head"><h2>${proxy?'代領人':'住戶'}身分查驗</h2></div><div class="card-body"><div class="verify-grid"><div class="verify-box"><small>住戶</small><b>${pickupItem.resident}</b></div><div class="verify-box"><small>房號</small><b>${pickupItem.room}</b></div>${proxy?`<div class="verify-box"><small>授權代領人</small><b>${pickupItem.proxy}</b></div>`:''}<div class="verify-box"><small>包裹編號</small><b>${pickupItem.id}</b></div><div class="verify-box"><small>櫃位</small><b>${pickupItem.cabinet}</b></div></div><div class="notice" style="margin-top:15px">請核對${proxy?'代領人':'住戶'}的實體身分證件。</div><label class="check"><input id="verifyPickup" type="checkbox" ${pickupVerified?'checked':''}>身分證件已核對</label><div class="modal-actions"><button class="button secondary" id="backPickupSearch">返回搜尋</button><button class="button" id="toPickupPhoto" ${pickupVerified?'':'disabled'}>前往照片存證</button></div></div></section>`}
    function pickupPhotoSrc(){return pickupItem.proxy?PROXY_PHOTO:RESIDENT_PHOTO}
    function pickupPhotoView(){return `<section class="card"><div class="card-head"><h2>領取照片存證</h2></div><div class="card-body"><div class="camera-box">${pickupPhoto?'<img src="'+pickupPhotoSrc()+'" alt="包裹交付照片">':'<div>相機預覽</div>'}</div><div class="camera-status"><b>${pickupPhoto?'照片拍攝完成':'尚未拍攝'}</b>${pickupPhoto?'<button class="mini" id="retakePickup">重新拍攝</button>':'<button class="button" id="capturePickup">開啟相機並拍攝</button>'}</div><div class="modal-actions" style="margin-top:16px"><button class="button secondary" id="backPickupVerify">返回身分查驗</button><button class="button" id="confirmPickup" ${pickupPhoto?'':'disabled'}>確認交付</button></div></div></section>`}
    function confirmPickupHandover(){modalRoot.innerHTML=`<div class="modal-bg"><div class="modal"><h2>確認交付包裹？</h2><div class="modal-data"><div><span>包裹編號</span><b>${pickupItem.id}</b></div><div><span>領取方式</span><b>${pickupItem.proxy?'授權代領':'本人領取'}</b></div><div><span>領取人</span><b>${pickupItem.proxy||pickupItem.resident}</b></div><div><span>櫃位</span><b>${pickupItem.cabinet}</b></div></div><div class="modal-actions"><button class="button secondary" id="cancelHandover">取消</button><button class="button" id="finishHandover">確認交付</button></div></div></div>`;document.getElementById('cancelHandover').onclick=()=>modalRoot.innerHTML='';document.getElementById('finishHandover').onclick=()=>{pickupItem.status='picked';records.unshift({id:'REC-'+Date.now().toString().slice(-6),parcel:pickupItem.id,resident:pickupItem.resident,recipient:pickupItem.proxy||pickupItem.resident,type:pickupItem.proxy?'授權代領':'本人領取',time:'2026/08/18 13:30',admin:'林怡君'});modalRoot.innerHTML='';pickupStep=4;renderPickup();showToast('領取完成，確認信已寄出')}}
    function renderPackages(){const available=packages.filter(p=>p.status==='available');adminContent.innerHTML=`<div class="head"><div><h1>包裹管理</h1><p>查詢並處理大樓包裹</p></div><button class="button" onclick="adminTab='add';renderAdmin()">登記新包裹</button></div><div class="stat-row"><div class="stat"><small>待領包裹</small><strong>${available.length}</strong></div><div class="stat"><small>今日到貨</small><strong>${packages.filter(p=>p.date.startsWith('2026/08/18')).length}</strong></div><div class="stat"><small>已授權代領</small><strong>${available.filter(p=>p.proxy).length}</strong></div></div><div class="toolbar"><input id="adminSearch" placeholder="搜尋包裹碼、住戶或房號"><select id="statusFilter"><option value="all">全部狀態</option><option value="available">待領取</option><option value="picked">已領取</option></select><button class="button secondary" id="applyFilter">搜尋</button></div><section class="card"><table class="history"><thead><tr><th>包裹編號</th><th>住戶／房號</th><th>包裹碼</th><th>櫃位</th><th>代領人</th><th>狀態</th><th>操作</th></tr></thead><tbody id="packageRows">${packageRows(packages)}</tbody></table></section>`;document.getElementById('applyFilter').onclick=()=>{const q=document.getElementById('adminSearch').value.trim();const s=document.getElementById('statusFilter').value;const filtered=packages.filter(p=>(s==='all'||p.status===s)&&(!q||[p.id,p.code,p.resident,p.room].some(v=>v.includes(q))));document.getElementById('packageRows').innerHTML=packageRows(filtered)}}
    function packageRows(list){return list.map(p=>`<tr><td>${p.id}</td><td><b>${p.resident}</b><br><small>${p.room}</small></td><td><b>${p.code}</b></td><td>${p.cabinet}</td><td>${p.proxy||'—'}</td><td>${badge(p)}</td><td>${p.status==='available'?`<button class="mini" onclick="openPickup('${p.id}')">處理領取</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">沒有符合的資料</td></tr>'}
    function openPickup(id){const p=packages.find(x=>x.id===id);modalRoot.innerHTML=`<div class="modal-bg"><div class="modal"><h2>確認包裹領取</h2><p>請先核對領取人身分。</p><div class="modal-data"><div><span>包裹碼</span><b>${p.code}</b></div><div><span>住戶</span><b>${p.resident}</b></div><div><span>領取方式</span><b>${p.proxy?'授權代領':'本人領取'}</b></div><div><span>領取人</span><b>${p.proxy||p.resident}</b></div></div><label class="check"><input type="checkbox" id="idVerified">身分證件已核對</label><div class="modal-actions"><button class="button secondary" id="closeModal">取消</button><button class="button" id="completePickup" disabled>完成領取</button></div></div></div>`;document.getElementById('closeModal').onclick=()=>modalRoot.innerHTML='';document.getElementById('idVerified').onchange=e=>document.getElementById('completePickup').disabled=!e.target.checked;document.getElementById('completePickup').onclick=()=>{p.status='picked';records.unshift({id:'REC-'+Date.now().toString().slice(-6),parcel:p.id,resident:p.resident,recipient:p.proxy||p.resident,type:p.proxy?'授權代領':'本人領取',time:'2026/08/18 13:30',admin:'林怡君'});modalRoot.innerHTML='';renderPackages();showToast('領取完成，確認信已寄出')}}
    function renderAdd(){adminContent.innerHTML=`<div class="head"><div><h1>登記包裹到貨</h1><p>建立新的待領包裹資料</p></div></div><section class="card" style="max-width:760px"><div class="card-head"><h2>包裹資料</h2></div><form class="card-body" id="addPackageForm"><div class="form-grid"><div class="field"><label>住戶姓名</label><input id="newResident" required></div><div class="field"><label>房號</label><input id="newRoom" required placeholder="例如 A棟 3F-2"></div><div class="field"><label>櫃位</label><input id="newCabinet" required></div><div class="field"><label>4 位數包裹碼</label><input id="newCode" required maxlength="4" pattern="[0-9]{4}"></div></div><div class="form-actions"><button class="button">完成登記並寄送通知</button></div></form></section>`;document.getElementById('addPackageForm').onsubmit=e=>{e.preventDefault();const code=document.getElementById('newCode').value;if(packages.some(p=>p.code===code)){showToast('包裹碼已存在');return}packages.unshift({id:'PKG-20260818-'+String(packages.length+830).padStart(4,'0'),code,resident:document.getElementById('newResident').value,room:document.getElementById('newRoom').value,cabinet:document.getElementById('newCabinet').value,date:'2026/08/18 13:30',status:'available',proxy:''});adminTab='packages';renderAdmin();showToast('包裹已登記，到貨通知已寄出')}}
    function renderResidents(){const residents=[...new Map(packages.map(p=>[p.room,{name:p.resident,room:p.room,available:packages.filter(x=>x.room===p.room&&x.status==='available').length,proxy:packages.find(x=>x.room===p.room&&x.proxy)?.proxy||'—'}])).values()];adminContent.innerHTML=`<div class="head"><div><h1>住戶與代領</h1><p>查看住戶包裹與已授權代領人</p></div></div><section class="card"><table class="history"><thead><tr><th>住戶</th><th>房號</th><th>待領包裹</th><th>目前授權代領人</th></tr></thead><tbody>${residents.map(r=>`<tr><td><b>${r.name}</b></td><td>${r.room}</td><td>${r.available}</td><td>${r.proxy}</td></tr>`).join('')}</tbody></table></section>`}
    function renderRecords(){adminContent.innerHTML=`<div class="head"><div><h1>領取紀錄</h1><p>查看已完成的包裹交付</p></div></div><section class="card"><table class="history"><thead><tr><th>紀錄編號</th><th>包裹編號</th><th>住戶</th><th>實際領取人</th><th>領取方式</th><th>時間</th><th>管理員</th></tr></thead><tbody>${records.map(r=>`<tr><td>${r.id}</td><td>${r.parcel}</td><td>${r.resident}</td><td>${r.recipient}</td><td>${r.type}</td><td>${r.time}</td><td>${r.admin}</td></tr>`).join('')}</tbody></table></section>`}
    loadTransferredState();openRole('resident');saveState();
  </script>
</body>
</html>
