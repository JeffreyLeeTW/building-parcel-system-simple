<body>
  <section class="admin-login" id="adminLogin">
    <form class="admin-login-box" id="adminLoginForm">
      <h1 class="admin-login-title">管理員登入</h1>
      <p class="admin-login-note">大樓包裹管理平台</p>
      <div class="field"><label for="adminAccount">帳號</label><input id="adminAccount" value="admin.lin" autocomplete="username" required></div>
      <div class="field"><label for="adminPassword">密碼</label><input id="adminPassword" type="password" value="12345678" autocomplete="current-password" required></div>
      <div class="login-error" id="loginError">帳號或密碼錯誤</div>
      <button class="button" type="submit">登入</button>
      <p class="login-hint">測試帳號已填入，可直接登入</p>
    </form>
  </section>
  <section class="access hidden" id="accessPage">
    <div class="access-box">
      <div class="access-title">大樓包裹管理平台</div>
      <div class="access-sub">請選擇使用身分</div>
      <div class="role-grid">
        <button class="role-card" id="residentEntry"><div class="role-icon">住</div><b>住戶入口</b><p>查看待領包裹、設定代領人及確認通知。</p><span>進入住戶頁面 →</span></button>
        <button class="role-card" id="adminEntry"><div class="role-icon">管</div><b>管理員入口</b><p>登記包裹、管理待領清單及處理領取。</p><span>進入管理頁面 →</span></button>
      </div>
    </div>
  </section>

  <section class="shell resident-shell hidden" id="residentApp">
    <header class="topbar"><div class="brand">大樓包裹管理平台｜住戶</div><div class="top-right"><div class="user"><b>陳怡安</b><small>A棟 12F-3</small></div><button class="outline switchRole">切換身分</button></div></header>
    <div class="layout"><main class="content" id="residentContent"></main></div>
  </section>

  <section class="shell hidden" id="adminApp">
    <header class="topbar"><div class="brand">大樓包裹管理平台｜管理員</div><div class="top-right"><div class="user"><b>林怡君</b><small>管理員</small></div><button class="outline" id="adminLogout">登出</button></div></header>

  </section>

    function loadTransferredState(){if(!location.hash.startsWith('#state='))return;try{const state=JSON.parse(decodeURIComponent(location.hash.slice(7)));if(Array.isArray(state.packages))packages=state.packages;if(Array.isArray(state.records))records=state.records;if(Array.isArray(state.residents))residents=state.residents}catch(error){console.warn('無法讀取同步資料')}}

    document.getElementById('residentEntry').onclick=()=>openRole('resident');document.getElementById('adminEntry').onclick=()=>openRole('admin');document.querySelectorAll('.switchRole').forEach(b=>b.onclick=backToRoles);
    function badge(p){if(p.status==='picked')return '<span class="badge picked">已領取</span>';if(p.proxy)return '<span class="badge proxy">已授權代領</span>';return '<span class="badge available">待領取</span>'}
    function renderResident(){const mine=packages.filter(p=>p.resident==='陳怡安'&&p.status==='available');residentContent.innerHTML=`<div class="head"><div><h1>我的包裹</h1><p>查看待領包裹與代領設定</p></div></div><div class="notice">您目前有 ${mine.length} 件包裹等待領取。</div><div class="grid"><section class="card"><div class="card-head"><h2>待領包裹</h2></div><div class="card-body"><div class="package-list">${mine.map(p=>`<article class="package"><div><h3>${p.id}　${badge(p)}</h3><div class="package-data"><div class="datum"><small>包裹碼</small><b class="code">${p.code}</b></div><div class="datum"><small>櫃位</small><b>${p.cabinet}</b></div><div class="datum"><small>到貨時間</small><b>${p.date}</b></div></div>${p.proxy?`<div style="margin-top:12px;color:#6f541d">代領人：${p.proxy}</div>`:''}</div><div class="actions"><button class="mini" onclick="openProxy('${p.id}')">${p.proxy?'修改代領人':'設定代領人'}</button></div></article>`).join('')||'<div class="empty">目前沒有待領包裹</div>'}</div></div></section><aside class="card"><div class="card-head"><h2>通知設定</h2></div><div class="card-body"><label class="check"><input type="checkbox" checked>包裹到貨時寄送 Email 通知</label><label class="check"><input type="checkbox" checked>包裹領取後寄送確認信</label><button class="button secondary" onclick="showToast('通知設定已儲存')">儲存設定</button></div></aside></div><section class="card" style="margin-top:18px"><div class="card-head"><h2>近期領取紀錄</h2></div><table class="history"><thead><tr><th>包裹編號</th><th>實際領取人</th><th>領取方式</th><th>領取時間</th></tr></thead><tbody>${records.filter(r=>r.resident==='陳怡安').map(r=>`<tr><td>${r.parcel}</td><td>${r.recipient}</td><td>${r.type}</td><td>${r.time}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">尚無領取紀錄</td></tr>'}</tbody></table></section>`}
    function openProxy(id){const p=packages.find(x=>x.id===id);modalRoot.innerHTML=`<div class="modal-bg"><form class="modal" id="proxyForm"><h2>設定包裹代領人</h2><p>${p.id}｜${p.room}</p><div class="field"><label>代領人姓名</label><input id="proxyName" value="${p.proxy}" required placeholder="請輸入真實姓名"></div><label class="check"><input type="checkbox" required>我授權上述人士代為領取此包裹。</label><div class="modal-actions"><button type="button" class="button secondary" id="closeModal">取消</button><button class="button">確認授權</button></div></form></div>`;document.getElementById('closeModal').onclick=()=>modalRoot.innerHTML='';document.getElementById('proxyForm').onsubmit=e=>{e.preventDefault();p.proxy=document.getElementById('proxyName').value.trim();modalRoot.innerHTML='';renderResident();showToast('代領授權已完成')}}
    document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.admin;document.querySelectorAll('[data-admin]').forEach(x=>x.classList.toggle('active',x===b));renderAdmin()});
    function renderAdmin(){if(adminTab==='add')return renderAdd();if(adminTab==='residents')return renderResidents();renderPickup()}
    function pickupSteps(){return `<div class="stepper"><div class="step ${pickupStep===1?'active':pickupStep>1?'done':''}"><span class="step-num">${pickupStep>1?'✓':'1'}</span>搜尋包裹</div><i class="step-line"></i><div class="step ${pickupStep===2?'active':pickupStep>2?'done':''}"><span class="step-num">${pickupStep>2?'✓':'2'}</span>身分查驗</div><i class="step-line"></i><div class="step ${pickupStep===3?'active':pickupStep>3?'done':''}"><span class="step-num">${pickupStep>3?'✓':'3'}</span>照片存證</div><i class="step-line"></i><div class="step ${pickupStep===4?'active':''}"><span class="step-num">4</span>完成</div></div>`}
    function pickupPackageInfo(){return `<div class="package-card"><div class="package-top"><b>包裹資料</b><span class="badge available">待領取</span></div><div class="package-details"><div class="parcel-photo"><div class="box-art" data-code="PKG ${pickupItem.code}"></div></div><div class="datum"><small>包裹編號</small><b>${pickupItem.id}</b></div><div class="datum"><small>櫃位</small><b>${pickupItem.cabinet}</b></div></div></div>`}
    function renderPickup(){let body='';if(pickupStep===1)body=`<section class="card simple-search"><div class="card-head"><h2>輸入包裹碼</h2></div><div class="card-body"><div class="search-box"><label for="pickupCode">4 位數包裹碼</label><div class="code-row"><input class="code-input" id="pickupCode" maxlength="4" inputmode="numeric" placeholder="0000" autocomplete="off"><button class="primary" id="pickupSearch">搜尋</button></div><div class="test-codes"><div class="test-code"><b>4826</b>本人領取測試</div><div class="test-code"><b>3504</b>授權代領測試</div></div></div><div id="pickupError"></div></div></section>`;if(pickupStep===2)body=pickupVerifyView();if(pickupStep===3)body=pickupPhotoView();if(pickupStep===4)body=`<section class="card success-wrap"><div class="success-icon">✓</div><h1>包裹領取完成</h1><div class="summary"><div class="summary-row"><div class="datum"><small>包裹編號</small><b>${pickupItem.id}</b></div><div class="datum"><small>領取方式</small><b>${pickupItem.proxy?'授權代領':'本人領取'}</b></div><div class="datum"><small>實際領取人</small><b>${pickupItem.proxy||pickupItem.resident}</b></div></div><div class="summary-row"><div class="datum"><small>櫃位</small><b>${pickupItem.cabinet}</b></div><div class="datum"><small>管理員</small><b>林怡君</b></div><div class="datum"><small>包裹狀態</small><span class="badge picked">已領取</span></div></div></div><div class="mail-note">領取確認信已寄送給住戶</div><button class="primary" id="nextPickup">處理下一件包裹</button></section>`;adminContent.innerHTML=`<div class="pickup-page"><div class="head"><div><h1>包裹領取</h1><p>依序完成搜尋、身分查驗與照片存證</p></div></div>${pickupSteps()}${body}</div>`;bindPickupFlow()}
    function bindPickupFlow(){document.getElementById('pickupSearch')?.addEventListener('click',searchPickup);document.getElementById('pickupCode')?.addEventListener('keydown',e=>{if(e.key==='Enter')searchPickup()});document.getElementById('verifyPickup')?.addEventListener('change',e=>{pickupVerified=e.target.checked;document.getElementById('toPickupPhoto').disabled=!pickupVerified});document.getElementById('toPickupPhoto')?.addEventListener('click',()=>{pickupStep=3;renderPickup()});document.getElementById('backPickupSearch')?.addEventListener('click',()=>{pickupStep=1;renderPickup()});document.getElementById('capturePickup')?.addEventListener('click',()=>{pickupPhoto=true;renderPickup()});document.getElementById('retakePickup')?.addEventListener('click',()=>{pickupPhoto=false;renderPickup()});document.getElementById('confirmPickup')?.addEventListener('click',confirmPickupHandover);document.getElementById('backPickupVerify')?.addEventListener('click',()=>{pickupStep=2;renderPickup()});document.getElementById('nextPickup')?.addEventListener('click',()=>{pickupStep=1;pickupItem=null;pickupVerified=false;pickupPhoto=false;renderPickup()})}
    function searchPickup(){const code=document.getElementById('pickupCode').value.trim(),item=packages.find(p=>p.code===code),error=document.getElementById('pickupError');if(!item){error.innerHTML='<div class="error-box" style="margin-top:16px"><h2>找不到此包裹</h2><p>請確認輸入的 4 位數包裹碼。</p></div>';return}if(item.status==='picked'){error.innerHTML='<div class="error-box" style="margin-top:16px"><h2>此包裹已領取</h2><p>已完成交付，不能再次領取。</p></div>';return}pickupItem=item;pickupStep=2;pickupVerified=false;pickupPhoto=false;renderPickup()}
    function pickupVerifyView(){const proxy=!!pickupItem.proxy;return `<div class="pickup-type-banner"><span>領取方式</span><b>${proxy?'授權代領':'本人領取'}</b></div><section class="card"><div class="card-head"><h2>${proxy?'代領人':'住戶'}身分查驗</h2></div><div class="card-body"><div class="grid"><div><div class="verify-list"><div class="verify-item"><small>${proxy?'原住戶':'住戶'}</small><b>${pickupItem.resident}</b></div><div class="verify-item"><small>房號</small><b>${pickupItem.room}</b></div>${proxy?`<div class="verify-item"><small>授權代領人</small><b>${pickupItem.proxy}</b></div>`:''}<div class="verify-item"><small>包裹編號</small><b>${pickupItem.id}</b></div><div class="verify-item"><small>櫃位</small><b>${pickupItem.cabinet}</b></div></div><div class="verify-help">請核對${proxy?'代領人':'住戶'}的實體身分證件。</div><label class="checkline"><input id="verifyPickup" type="checkbox" ${pickupVerified?'checked':''}>身分證件已核對</label></div><div>${pickupPackageInfo()}</div></div><div class="action-row"><button class="secondary" id="backPickupSearch">返回搜尋</button><button class="primary" id="toPickupPhoto" ${pickupVerified?'':'disabled'}>前往照片存證</button></div></div></section>`}
    function pickupPhotoSrc(){return pickupItem.proxy?PROXY_PHOTO:RESIDENT_PHOTO}
    function pickupPhotoView(){return `<section class="card"><div class="card-head"><h2>領取照片存證</h2>${pickupPhoto?'<span class="badge available">照片已完成</span>':''}</div><div class="card-body"><div class="camera ${pickupPhoto?'captured':''}">${pickupPhoto?'<img class="evidence-photo" src="'+pickupPhotoSrc()+'" alt="包裹交付照片">':'<div class="camera-placeholder"><div class="camera-icon">📷</div><b>相機預覽</b></div>'}</div><div class="status-panel"><div><b>${pickupPhoto?'照片拍攝完成':'尚未拍攝'}</b></div><div>${pickupPhoto?'<button class="secondary" id="retakePickup">重新拍攝</button>':'<button class="primary" id="capturePickup">開啟相機並拍攝</button>'}</div></div><div class="action-row"><button class="secondary" id="backPickupVerify">返回身分查驗</button><button class="primary" id="confirmPickup" ${pickupPhoto?'':'disabled'}>確認交付</button></div></div></section>`}
    function confirmPickupHandover(){modalRoot.innerHTML=`<div class="modal-bg"><div class="modal"><h2>確認交付包裹？</h2><div class="modal-data"><div><span>包裹編號</span><b>${pickupItem.id}</b></div><div><span>領取方式</span><b>${pickupItem.proxy?'授權代領':'本人領取'}</b></div><div><span>領取人</span><b>${pickupItem.proxy||pickupItem.resident}</b></div><div><span>櫃位</span><b>${pickupItem.cabinet}</b></div></div><div class="modal-actions"><button class="button secondary" id="cancelHandover">取消</button><button class="button" id="finishHandover">確認交付</button></div></div></div>`;document.getElementById('cancelHandover').onclick=()=>modalRoot.innerHTML='';document.getElementById('finishHandover').onclick=()=>{pickupItem.status='picked';records.unshift({id:'REC-'+Date.now().toString().slice(-6),parcel:pickupItem.id,resident:pickupItem.resident,recipient:pickupItem.proxy||pickupItem.resident,type:pickupItem.proxy?'授權代領':'本人領取',time:'2026/08/18 13:30',admin:'林怡君'});saveState();modalRoot.innerHTML='';pickupStep=4;renderPickup();showToast('領取完成，確認信已寄出')}}
    function renderPackages(){const available=packages.filter(p=>p.status==='available');adminContent.innerHTML=`<div class="head"><div><h1>包裹管理</h1><p>查詢並處理大樓包裹</p></div><button class="button" onclick="adminTab='add';renderAdmin()">登記新包裹</button></div><div class="stat-row"><div class="stat"><small>待領包裹</small><strong>${available.length}</strong></div><div class="stat"><small>今日到貨</small><strong>${packages.filter(p=>p.date.startsWith('2026/08/18')).length}</strong></div><div class="stat"><small>已授權代領</small><strong>${available.filter(p=>p.proxy).length}</strong></div></div><div class="toolbar"><input id="adminSearch" placeholder="搜尋包裹碼、住戶或房號"><select id="statusFilter"><option value="all">全部狀態</option><option value="available">待領取</option><option value="picked">已領取</option></select><button class="button secondary" id="applyFilter">搜尋</button></div><section class="card"><table class="history"><thead><tr><th>包裹編號</th><th>住戶／房號</th><th>包裹碼</th><th>櫃位</th><th>代領人</th><th>狀態</th><th>操作</th></tr></thead><tbody id="packageRows">${packageRows(packages)}</tbody></table></section>`;document.getElementById('applyFilter').onclick=()=>{const q=document.getElementById('adminSearch').value.trim();const s=document.getElementById('statusFilter').value;const filtered=packages.filter(p=>(s==='all'||p.status===s)&&(!q||[p.id,p.code,p.resident,p.room].some(v=>v.includes(q))));document.getElementById('packageRows').innerHTML=packageRows(filtered)}}
    function packageRows(list){return list.map(p=>`<tr><td>${p.id}</td><td><b>${p.resident}</b><br><small>${p.room}</small></td><td><b>${p.code}</b></td><td>${p.cabinet}</td><td>${p.proxy||'—'}</td><td>${badge(p)}</td><td>${p.status==='available'?`<button class="mini" onclick="openPickup('${p.id}')">處理領取</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">沒有符合的資料</td></tr>'}
    function openPickup(id){const p=packages.find(x=>x.id===id);if(!p||p.status==='picked')return;adminTab='pickup';pickupItem=p;pickupStep=2;pickupVerified=false;pickupPhoto=false;document.querySelectorAll('[data-admin]').forEach(b=>b.classList.toggle('active',b.dataset.admin==='pickup'));renderAdmin()}
    function ensureResidentIds(){const used=new Set(residents.map(resident=>resident.id).filter(Boolean));let next=1;residents.forEach(resident=>{if(resident.id)return;while(used.has('RES-'+String(next).padStart(4,'0')))next++;resident.id='RES-'+String(next).padStart(4,'0');used.add(resident.id)})}
    function selectedNewRoom(){const building=document.getElementById('newBuilding')?.value,floor=document.getElementById('newFloor')?.value,unit=document.getElementById('newUnit')?.value;return building&&floor&&unit?building+' '+floor+'-'+unit:''}
    function updateNewResidentOptions(){const select=document.getElementById('newResident'),help=document.getElementById('residentMatchHelp'),room=selectedNewRoom();if(!select)return;const matches=residents.filter(resident=>resident.room===room);select.innerHTML='<option value="">'+(!room?'請先選擇房號':matches.length?'請選擇住戶':'此房號沒有住戶')+'</option>'+matches.map(resident=>'<option value="'+escapeText(resident.id)+'">'+escapeText(resident.name)+'</option>').join('');select.disabled=!room||!matches.length;help.textContent=!room?'請先選擇完整房號':matches.length?'僅顯示此房號的住戶':'此房號沒有住戶，請先至住戶資料新增';help.style.color=room&&!matches.length?'#a33b49':'var(--muted)'}
    function renderAdd(){
      ensureResidentIds();
      adminContent.innerHTML=`<div class="add-page"><div class="head"><div><h1>登記新包裹</h1><p>建立新的待領包裹資料</p></div></div><section class="card add-card"><div class="card-head"><h2>包裹資料</h2></div><form class="card-body" id="addPackageForm"><div class="form-grid"><div class="field"><label>房號</label><div class="room-selects"><select id="newBuilding" aria-label="棟別" required><option value="">棟別</option>${['A','B','C'].map(v=>'<option value="'+v+'棟">'+v+'棟</option>').join('')}</select><select id="newFloor" aria-label="樓層" required><option value="">樓層</option>${Array.from({length:20},(_,i)=>'<option value="'+(i+1)+'F">'+(i+1)+'F</option>').join('')}</select><select id="newUnit" aria-label="戶號" required><option value="">戶號</option>${Array.from({length:6},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'號</option>').join('')}</select></div></div><div class="field"><label for="newResident">住戶姓名</label><select id="newResident" required disabled><option value="">請先選擇房號</option></select><small id="residentMatchHelp" style="display:block;margin-top:7px;color:var(--muted)">請先選擇完整房號</small></div><div class="field"><label>櫃位</label><div class="cabinet-selects"><select id="newCabinetArea" aria-label="櫃位區域" required><option value="">區域</option>${['A','B','C','D'].map(v=>'<option value="'+v+'">'+v+'區</option>').join('')}</select><select id="newCabinetNumber" aria-label="櫃號" required><option value="">櫃號</option>${Array.from({length:20},(_,i)=>{const n=String(i+1).padStart(2,'0');return '<option value="'+n+'">'+n+'號</option>'}).join('')}</select></div></div><div class="auto-code-note"><b>包裹碼由系統自動產生</b><span>完成登記後將寄送給住戶</span></div></div><div class="form-actions"><button class="button">完成登記並寄送通知</button></div></form></section></div>`;
      adminContent.querySelector('.head p').innerHTML='<span style="display:inline-block;color:#52606d">測試資料：<b style="color:var(--ink)">陳怡安　A棟 12F-3</b></span>';
      ['newBuilding','newFloor','newUnit'].forEach(id=>document.getElementById(id).addEventListener('change',updateNewResidentOptions));
      document.getElementById('addPackageForm').onsubmit=e=>{e.preventDefault();const room=selectedNewRoom(),resident=residents.find(item=>item.id===document.getElementById('newResident').value);if(!resident||resident.room!==room){showToast('請選擇此房號對應的住戶');return}let code;do{code=String(Math.floor(1000+Math.random()*9000))}while(packages.some(p=>p.code===code));const cabinet=document.getElementById('newCabinetArea').value+'-'+document.getElementById('newCabinetNumber').value;packages.unshift({id:'PKG-20260818-'+String(packages.length+830).padStart(4,'0'),code,residentId:resident.id,resident:resident.name,room,cabinet,date:'2026/08/18 13:30',status:'available',proxy:''});saveState();adminTab='add';renderAdmin();showToast('包裹已登記，包裹碼 '+code+' 已寄出')}
    }
    function escapeText(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function renderResidents(){adminContent.innerHTML=`<div class="head"><div><h1>管理住戶資料</h1></div><button class="button" onclick="openResidentForm()">新增住戶</button></div><section class="card"><table class="history"><thead><tr><th>住戶姓名</th><th>房號／樓層</th><th>Email</th><th>密碼</th><th>操作</th></tr></thead><tbody>${residents.map((r,index)=>`<tr><td><b>${escapeText(r.name)}</b></td><td>${escapeText(r.room)}</td><td>${escapeText(r.email)}</td><td>${r.password}</td><td><div class="resident-actions"><button class="mini" onclick="openResidentForm(${index})">修改</button><button class="mini danger" onclick="confirmDeleteResident(${index})">刪除</button></div></td></tr>`).join('')}</tbody></table></section>`}
    function residentRoomFields(room=''){const match=room.match(/^([ABC])棟\s+(\d+)F-(\d+)$/),building=match?.[1]||'',floor=match?.[2]||'',unit=match?.[3]||'';return `<div class="room-selects"><select id="residentBuilding" required aria-label="棟別"><option value="">棟別</option>${['A','B','C'].map(v=>`<option value="${v}" ${v===building?'selected':''}>${v}棟</option>`).join('')}</select><select id="residentFloor" required aria-label="樓層"><option value="">樓層</option>${Array.from({length:20},(_,i)=>{const v=String(i+1);return `<option value="${v}" ${v===floor?'selected':''}>${v}F</option>`}).join('')}</select><select id="residentUnit" required aria-label="戶號"><option value="">戶號</option>${Array.from({length:6},(_,i)=>{const v=String(i+1);return `<option value="${v}" ${v===unit?'selected':''}>${v}號</option>`}).join('')}</select></div>`}
    function openResidentForm(index){const editing=Number.isInteger(index),r=editing?residents[index]:{name:'',room:'',email:'',password:''};modalRoot.innerHTML=`<div class="modal-bg"><form class="modal" id="residentForm"><h2>${editing?'修改住戶':'新增住戶'}</h2><div class="field"><label>住戶姓名</label><input id="residentName" value="${escapeText(r.name)}" required></div><div class="resident-modal-room"><label>房號／樓層</label>${residentRoomFields(r.room)}</div><div class="field"><label>Email</label><input id="residentEmail" type="email" value="${escapeText(r.email)}" required></div><div class="field"><label>${editing?'新密碼（不修改可留空）':'密碼'}</label><input id="residentPassword" type="password" ${editing?'':'required'}></div><div class="modal-actions"><button type="button" class="button secondary" id="cancelResidentForm">取消</button><button class="button">${editing?'儲存修改':'新增住戶'}</button></div></form></div>`;document.getElementById('cancelResidentForm').onclick=()=>modalRoot.innerHTML='';document.getElementById('residentForm').onsubmit=e=>{e.preventDefault();const updated={name:document.getElementById('residentName').value.trim(),room:document.getElementById('residentBuilding').value+'棟 '+document.getElementById('residentFloor').value+'F-'+document.getElementById('residentUnit').value,email:document.getElementById('residentEmail').value.trim(),password:'••••••••'};if(editing)residents[index]=updated;else residents.push(updated);saveState();modalRoot.innerHTML='';renderResidents();showToast(editing?'住戶資料已修改':'住戶已新增')}}
    function confirmDeleteResident(index){const r=residents[index];if(!r)return;modalRoot.innerHTML=`<div class="modal-bg"><div class="modal"><h2>刪除住戶？</h2><p>確定要刪除「${escapeText(r.name)}／${escapeText(r.room)}」的住戶資料嗎？</p><div class="modal-actions"><button class="button secondary" id="cancelDeleteResident">取消</button><button class="button danger" id="deleteResident">確認刪除</button></div></div></div>`;document.getElementById('cancelDeleteResident').onclick=()=>modalRoot.innerHTML='';document.getElementById('deleteResident').onclick=()=>{residents.splice(index,1);saveState();modalRoot.innerHTML='';renderResidents();showToast('住戶已刪除')}}
    function renderRecords(){adminContent.innerHTML=`<div class="head"><div><h1>領取紀錄</h1><p>查看已完成的包裹交付</p></div></div><section class="card"><table class="history"><thead><tr><th>紀錄編號</th><th>包裹編號</th><th>住戶</th><th>實際領取人</th><th>領取方式</th><th>時間</th><th>管理員</th></tr></thead><tbody>${records.map(r=>`<tr><td>${r.id}</td><td>${r.parcel}</td><td>${r.resident}</td><td>${r.recipient}</td><td>${r.type}</td><td>${r.time}</td><td>${r.admin}</td></tr>`).join('')}</tbody></table></section>`}
    loadTransferredState();saveState();
    document.getElementById('adminLoginForm').onsubmit=e=>{e.preventDefault();const valid=document.getElementById('adminAccount').value==='admin.lin'&&document.getElementById('adminPassword').value==='12345678';document.getElementById('loginError').classList.toggle('show',!valid);if(!valid)return;document.getElementById('adminLogin').classList.add('hidden');openRole('admin')};
    document.getElementById('adminLogout').onclick=()=>{adminApp.classList.add('hidden');document.getElementById('adminLogin').classList.remove('hidden')};
  </script>
</body>
</html>
